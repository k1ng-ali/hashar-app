services:
  # Development database. Backend and frontend run locally with hot reload.
  db:
    image: postgres:16-alpine
    container_name: fund_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fund_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fund_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
