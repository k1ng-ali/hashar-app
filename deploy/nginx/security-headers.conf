# Заголовки безопасности. Подключается в каждый location: add_header внутри location
# отменяет унаследованные с уровня server.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: скрипты только свои (javascript:-ссылки не выполняются), стили — свои + inline от ant-design-vue,
# шрифт Inter с Google Fonts, картинки — свои, data: (чеки) и https: (аватары провайдеров входа)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
