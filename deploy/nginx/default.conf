# ─── nginx фронтенда: только статика SPA ──────────────────────────────────────
# API живёт на своём поддомене (API_DOMAIN) — Caddy ведёт его прямо в backend.
# HTTPS терминирует Caddy перед этим контейнером (deploy/Caddyfile).

server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Сборка Vite: имена с хешем — можно кешировать навсегда
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Манифест PWA: расширения .webmanifest нет в mime.types nginx
    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Иконки из public/ — без хеша в имени, поэтому кеш на сутки
    location ~* ^/(favicon|apple-touch-icon|icon-|logo) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # index.html не кешируем — иначе после деплоя браузер просит старые ассеты
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
