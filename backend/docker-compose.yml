# ─── Локальная разработка ──────────────────────────────────────────────────────
# Запуск: docker compose up -d
# Только база: docker compose up -d db
# База + хранилище чеков (для бэкенда из .venv): docker compose up -d db storage
# Для прода — deploy/docker-compose.yml (образ из Docker Hub, без seed, за HTTPS)

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5
      timeout: 5s
    volumes:
      - db-data:/var/lib/postgresql/data

  # S3-совместимое хранилище чеков вместо Cloudflare R2 (RustFS: MinIO больше не публикует образы).
  # API — :9000, консоль — http://localhost:9001 (rustfsadmin / rustfsadmin). Бакет создаёт scripts/init_storage.py
  storage:
    image: rustfs/rustfs:1.0.3
    restart: always
    # Именованный том принадлежит root, а RustFS по умолчанию работает от 10001
    user: "0:0"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data

  backend:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Ссылки на чеки подписываются этим адресом и открываются браузером на хосте —
      # host.docker.internal доступен и из контейнера, и с хоста (Docker Desktop)
      S3_ENDPOINT_URL: http://host.docker.internal:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: >
      sh -c "
      alembic upgrade head &&
      python -m scripts.init_storage &&
      python -m scripts.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - .:/app

volumes:
  db-data:
  storage-data:
