# ─── Frontend: сборка Vite → GitHub Pages ─────────────────────────────────────
# Push в release (изменения вне backend/ и deploy/) → https://hashar.app
#
# Один раз в репозитории: Settings → Pages → Source: GitHub Actions,
# Custom domain: hashar.app, Enforce HTTPS — вкл.

name: Frontend

on:
  push:
    branches: [release]
    paths-ignore:
      - "backend/**"
      - "deploy/**"
      - "android/**"
      - ".github/workflows/backend.yml"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Адрес API вшивается в сборку и в CSP (connect-src)
      VITE_API_URL: https://api.hashar.app
      VITE_DEV_MODE: "false"
      # Вход через Google: Client ID веб-клиента OAuth (не секрет). Settings → Secrets and variables →
      # Actions → Variables. Пусто — кнопка Google не показывается
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # SPA на Pages: неизвестный путь (/join/CODE, /fund/...) отдаёт 404.html — это тот же index.html
      # Ссылки из Google Play и Google Cloud (о проекте, политика, условия, удаление аккаунта) должны отвечать 200, а не 404 —
      # для них кладём копию index.html в папку с тем же именем
      - run: |
          cp dist/index.html dist/404.html
          for page in about privacy terms account-deletion; do
            mkdir -p "dist/$page" && cp dist/index.html "dist/$page/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
